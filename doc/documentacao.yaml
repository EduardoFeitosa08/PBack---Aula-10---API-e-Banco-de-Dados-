openapi: 3.0.3
info:
  title: Projeto do SENAI Jandira - Eduardo Feitosa - Locadora de Filmes
  description: |-
   API destinada a controle de filmes, atores, diretores, generos, classificações indicativas e publicadores.
  contact:
    email: eduardo.edubatista008@gmail.com
  version: 1.0.0
externalDocs:
  description: GitHub profile from the developer
  url: https://github.com/EduardoFeitosa08
servers:
  - url: http://
paths:
  /v1/locadora/filmes:
    post:
      tags:
        - Filmes
      summary: Adiciona um novo Filme
      description: Adiciona um novo Filme
      requestBody:
        description: JSON contendo os dados do novo filme a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
    get:
      tags:
        - Filmes
      summary: Lista todos os Filmes
      description: Listagem de todos os Filmes registrados no sistema
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resposta'  
                
                          
           
        '404':
          description: Not Found
  /v1/locadora/filmes/{id}:
    get:
      tags:
        - Filmes
      summary: Busca um Filme pelo ID
      description: Retorna um Filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID of film to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resposta'          
        '400':
          description: Invalid ID supplied
        '404':
          description: Film not found
    put:
      tags:
        - Filmes
      summary: Update an existing Film
      description: Update an existing Film by Id
      parameters:
        - name: id
          in: path
          description: ID of Film to return
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Update an existent Film in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Film not found
       
    delete:
      tags:
        - Filmes
      summary: Delete Filme
      description: Excluir um Filme
      parameters:
        - name: id
          in: path
          description: ID of Film to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Film not found
  
