components:
  schemas:
    Resposta:
      required:
        - status
        - status_code
      type: object
      properties:
        status:
          type: boolean
        status_code:
          type: integer
        development:
          type: string
        api_description:
          type: string
        version:
          type: string
        request_date:
          type: string
        response:
          type: object
        message:
          type: string
          
    Filme:
      required:
        - nome
        - sinopse
        - data_lancamento
        - duracao
        - orcamento
        - trailer
        - capa
      type: object
      properties:
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
        duracao:
          type: string
        orcamento:
          type: number
        trailer:
          type: string
        capa:
          type: string
    
    Genero:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          
    Classificacao:
      required:
        - nome
        - idade_minima
      type: object
      properties:
        nome:
          type: string
        idade_minima:
          type: integer
          
    Ator:
      required:
        - nome
        - genero
        - data_nascimento
        - data_morte
        - img
      type: object
      properties:
        nome:
          type: string
        genero:
          type: string
        data_nascimento:
          type: string
        data_morte:
          type: string
        img:
          type: string
    
    Diretor:
      required:
        - nome
        - genero
        - data_nascimento
        - data_morte
        - img
      type: object
      properties:
        nome:
          type: string
        genero:
          type: string
        data_nascimento:
          type: string
        data_morte:
          type: string
        img:
          type: string
          
    Publicador:
      required:
        - nome
        - is_ativa
        - logradouro
        - cidade
        - estado
        - pais
      type: object
      properties:
        nome:
          type: string
        data_fundacao:
          type: string
        is_ativa:
          type: boolean
        logradouro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        pais:
          type: string
  requestBodies:
    Filme:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'
    Genero:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Genero'
    Classificacao:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Classificacao'
    Ator:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ator'
    Diretor:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diretor'
    Publicador:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Publicador'
            